<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Entrar | Escritório Online</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --gold: #a67c2e;
    --gold-light: #c9a24b;
    --dark: #0f0e0c;
    --dark-2: #181612;
    --cream: #f6f2ea;
    --text-muted: #6e6759;
    --border: #38342a;
    --danger: #c6616c;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--dark);
    color: var(--cream);
    font-family: 'Manrope', sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 20px;
  }
  .box {
    width: 100%;
    max-width: 360px;
    background: var(--dark-2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 36px 32px;
  }
  h1 {
    font-family: 'Playfair Display', serif;
    font-size: 20px;
    margin: 0 0 4px;
    text-align: center;
  }
  .sub {
    text-align: center;
    font-size: 13px;
    color: var(--text-muted);
    margin: 0 0 24px;
  }
  label {
    display: block;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--text-muted);
    margin-bottom: 6px;
  }
  input {
    width: 100%;
    padding: 11px 13px;
    margin-bottom: 16px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: #0f0e0c;
    color: var(--cream);
    font: inherit;
  }
  input:focus { outline: none; border-color: var(--gold); }
  button {
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 6px;
    background: linear-gradient(135deg, var(--gold-light), var(--gold));
    color: #14120f;
    font-weight: 700;
    font-size: 14px;
    cursor: pointer;
    margin-top: 6px;
  }
  button:disabled { opacity: 0.6; cursor: default; }
  .erro {
    color: var(--danger);
    font-size: 13px;
    min-height: 18px;
    margin: 10px 0 0;
    text-align: center;
  }
</style>
</head>
<body>
  <form class="box" id="loginForm" autocomplete="on">
    <h1>Escritório Online</h1>
    <p class="sub">JS Advocacia — acesso da equipe</p>
    <label for="usuario">Usuário</label>
    <input id="usuario" name="usuario" autocomplete="username" required autofocus>
    <label for="senha">Senha</label>
    <input id="senha" name="senha" type="password" autocomplete="current-password" required>
    <button type="submit" id="btnEntrar">Entrar</button>
    <p class="erro" id="erro"></p>
  </form>

  <script>
    const form = document.getElementById('loginForm');
    const erro = document.getElementById('erro');
    const btn = document.getElementById('btnEntrar');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      erro.textContent = '';
      btn.disabled = true;
      btn.textContent = 'Entrando...';
      try {
        const resp = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            usuario: document.getElementById('usuario').value,
            senha: document.getElementById('senha').value,
          }),
        });
        const dados = await resp.json();
        if (!resp.ok) {
          erro.textContent = dados.erro || 'Não foi possível entrar.';
          btn.disabled = false;
          btn.textContent = 'Entrar';
          return;
        }
        const params = new URLSearchParams(location.search);
        const destino = params.get('redirect') || '/sistema.html';
        location.href = destino;
      } catch (err) {
        erro.textContent = 'Erro de conexão. Tente novamente.';
        btn.disabled = false;
        btn.textContent = 'Entrar';
      }
    });
  </script>
</body>
</html>
